  # QUIC 只对走代理的目标拒绝，不一刀切——非 443 UDP（Switch 联机、WebRTC、VoIP）
  # 仍要能走代理。拒绝后客户端会回落 TCP/TLS，从而受规则与 sniffer 管辖。
  # ⚠ 这个 AND 写法此前从未验证过（设计文档 Open Questions 列为待验），
  #   靠 mihomo -t 检验；若不通过则改用 sub-rule。
