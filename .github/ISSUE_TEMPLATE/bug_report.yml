name: Bug report
description: Something on the device or in the tools is broken
labels: [bug]
body:
  - {type: textarea, id: what, attributes: {label: What went wrong}, validations: {required: true}}
  - {type: textarea, id: expected, attributes: {label: What should have happened}}
  - {type: textarea, id: steps, attributes: {label: Steps to reproduce}}
  - type: textarea
    id: device
    attributes:
      label: Your device
      value: |
        Firmware (for example B31):
        Component versions (web admin → Versions, or `./install.sh status`):
        Where you saw it (touch screen / web admin / SSH):
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: doctor output or log lines. Remove IMEI, ICCID, phone numbers and public IPs first.
      render: text
