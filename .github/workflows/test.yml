# Host (x86_64) tests of the manager crates plus an aarch64 build, in the same image as release.yml
# and the install kit (onboard/build.Dockerfile). Default members only: the touch UI's lvgl-sys
# needs LVGL_DIR/FT_SRC (touch-ui/rs/build.sh); luyaz-mcp runs on the computer and gets its own run.

name: Test

on:
  push: {branches: [main]}
  pull_request:

permissions: {contents: read}

env:
  RUN: docker run --rm -v ${{ github.workspace }}:/src -w /src -e CARGO_TARGET_DIR=/src/target luyaz-rust-build

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - {name: Check out, uses: actions/checkout@v4}

      - name: Build image
        run: docker build -t luyaz-rust-build -f onboard/build.Dockerfile onboard

      - name: cargo test (workspace defaults, then luyaz-mcp)
        run: $RUN sh -c 'cargo test --locked && cargo test --locked -p luyaz-mcp'

      - name: aarch64 build
        run: $RUN cargo zigbuild --locked --target aarch64-unknown-linux-musl -p luyaz-core -p luyaz-sentinel -p luyaz-web
