[package]
name = "luyaz-speedtest"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
description = "U60 Pro (MU5250) speed test engine used by u60d's compatibility layer (u60-platform.md Phase 4 step 8e). Moved out of zte-agent (removed 2026-10-14)."
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
url = "2"

[dev-dependencies]
tiny_http = "0.12"
