[package]
name = "sms-forward"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "u60-policy's SMS forward bookkeeping as a component (wit/sms-forward.wit)."
license = "PolyForm-Noncommercial-1.0.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
luyaz-policy = { path = "../../luyaz-policy" }
wit-bindgen = { version = "=0.62.0", default-features = false, features = ["macros", "realloc"] }
