[package]
name = "luyaz-sms-forward"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
description = "U60 Pro (MU5250) SMS forwarding engine run by the core; every device effect goes through a Host."
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[dependencies]
luyaz-api = { path = "../luyaz-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
libc = "0.2"

[dev-dependencies]
# contract tests: this crate's pass equals luyaz-policy's, and its shadow records replay there
luyaz-policy = { path = "../luyaz-policy", features = ["serde"] }
