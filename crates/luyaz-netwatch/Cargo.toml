[package]
name = "luyaz-netwatch"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
description = "U60 Pro (MU5250) cellular link watcher: one sample's judgements, the operator DNS probe and the signal history log (/data/signal-log), run by u60d."
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[dependencies]
luyaz-api = { path = "../luyaz-api" }
# state files and records are JSON
serde_json = "1"
serde = { version = "1", features = ["derive"] }
luyaz-speedtest = { path = "../luyaz-speedtest" }

# Already cached/locked via tokio; bound sockets, no helper processes.
socket2 = { version = "0.6", features = ["all"] }
