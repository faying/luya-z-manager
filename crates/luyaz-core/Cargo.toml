[package]
name = "luyaz-core"
version = "1.5.0"
edition = "2024"
rust-version = "1.99"
description = "Luya-Z core daemon (luyaz-core): device read path, HTTP API and write path, policies, wake ledger."
license = "MIT"

[dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "signal", "macros", "io-util", "sync", "process", "fs"] }
# moved from zwrt-datad (data-service 8605c28): the read path
anyhow = "1"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
rsa = "0.9"
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"
crc32c = "0.6"
# HMAC references for secret fields in the event log (sens.rs); already in the tree via rsa
sha2 = "0.10"
libc = "0.2"
# the agent's alert files, login and clock offset for the touch compatibility layer (compat.rs)
luyaz-api = { path = "../luyaz-api" }
luyaz-esim = { path = "../luyaz-esim" }
luyaz-netwatch = { path = "../luyaz-netwatch" }
luyaz-home-exit = { path = "../luyaz-home-exit" }
luyaz-manual-first = { path = "../luyaz-manual-first" }
luyaz-sms-forward = { path = "../luyaz-sms-forward" }
luyaz-speedtest = { path = "../luyaz-speedtest" }
luyaz-scenario = { path = "../luyaz-scenario" }
luyaz-wifi = { path = "../luyaz-wifi" }
# the scenario engine's thread calls /control and this touch layer blocking (step 9h)
ureq = { version = "3", features = ["json"] }
# moved from zwrt-datad (data-service 68416eb): HTTP and the write path (Phase 3)
axum = { version = "0.8", features = ["http1", "json", "query", "tokio"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["limit", "trace"] }
# Phase 4: policies (built-in) and the wasm host for their components. Runtime only: components are
# precompiled by crates/luyaz-plugins/plugc (cranelift), with the Config in src/plugin/config.rs.
luyaz-policy = { path = "../luyaz-policy", features = ["serde"] }
wasmtime = { version = "=48.0.5", default-features = false, features = ["runtime", "component-model", "std"] }

[dev-dependencies]
# a fake device for the shared scenario engine (step 9h)
luyaz-scenario = { path = "../luyaz-scenario", features = ["testing"] }
# contract schemas are generated by a test (contract-schema.json); not in the device binary
schemars = "1"
tokio = { version = "1", features = ["test-util"] }
