[package]
name = "luyaz-manual-first"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
description = "U60 Pro (MU5250) CHILL manual-first runtime (mihomo) run by u60d (u60-platform.md Phase 4 step 9g). Moved out of zte-agent (removed 2026-10-14)."
license = "MIT"
publish = false

[dependencies]
serde_json = "1"
ureq = { version = "3", features = ["json"] }
luyaz-api = { path = "../luyaz-api" }
# the one Machine (decisions, Persist's file shape); its serde gives the state file and records
luyaz-policy = { path = "../luyaz-policy", features = ["serde"] }
