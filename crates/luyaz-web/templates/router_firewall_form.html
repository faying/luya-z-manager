<button id="fw-{{ which }}btn" type="button" class="nd-btn nd-btn--secondary nd-btn--sm" aria-expanded="{{ open }}" aria-controls="fw-{{ which }}form" data-on:click="@post('/router/firewall/{{ which }}/{% if open %}close{% else %}form{% endif %}')">{% if open %}{{ l.pick("Cancel", "取消") }}{% else if which == "dmz" %}{{ l.pick("Change", "更改") }}{% else %}{{ l.pick("Add Rule", "添加规则") }}{% endif %}</button>
<!--leaf-->
<div id="fw-{{ which }}form">{% if open %}<div class="nd-group grid gap-3 p-4 mt-2 mb-3" role="group" aria-label="{% if which == "dmz" %}DMZ{% else %}{{ l.pick("New rule", "新规则") }}{% endif %}" data-signals="{{ sigs }}">
{% if which == "dmz" %}<div class="flex items-center gap-3"><span class="nd-body flex-1" id="fw-don-l">DMZ</span><button type="button" role="switch" class="nd-switch t-switch" aria-labelledby="fw-don-l" aria-checked="{{ on }}"{% if on %} data-selected="true"{% endif %} data-attr:aria-checked="$_don ? 'true' : 'false'" data-attr:data-selected="$_don" data-on:click="$_don = !$_don"><span class="nd-switch__track"><svg class="nd-switch__check" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.2 5 8.6 9.5 3.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="nd-switch__thumb"></span></span></button></div>
<label class="grid gap-1"><span class="nd-aux">{{ l.pick("DMZ Host IP", "DMZ 主机 IP") }}</span><input class="nd-field nd-mono" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="{{ hint }}" data-bind="_dip" data-attr:disabled="!$_don"></label>
{% if let Some(n) = lan %}<span class="nd-aux">{{ l.pick("LAN: ", "局域网：") }}<span class="nd-mono" data-data>{{ n }}</span></span>{% endif %}
<div><button type="button" class="nd-btn nd-btn--primary" data-on:click="@post('/router/firewall/dmz/ask', {filterSignals: {include: /^_d/, exclude: /(?!)/}})">{{ l.pick("Apply", "应用") }}</button></div>
{% else %}<div class="grid gap-3 fw-2col">
<label class="grid gap-1"><span class="nd-aux">{{ l.pick("Name", "名称") }}</span><input class="nd-field" autocomplete="off" maxlength="32" placeholder="{{ l.pick("Rule name", "规则名称") }}" data-bind="_pn"></label>
<label class="grid gap-1"><span class="nd-aux">{{ l.pick("Protocol", "协议") }}</span><select class="nd-field" data-bind="_pp"><option value="TCP">TCP</option><option value="UDP">UDP</option><option value="Both">{{ l.pick("Both", "两者") }}</option></select></label>
<label class="grid gap-1"><span class="nd-aux">{{ l.pick("WAN Port", "WAN 端口") }}</span><input class="nd-field nd-mono" inputmode="numeric" autocomplete="off" placeholder="8080" data-bind="_pw"></label>
<label class="grid gap-1"><span class="nd-aux">{{ l.pick("LAN IP", "LAN IP") }}</span><input class="nd-field nd-mono" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="{{ hint }}" data-bind="_pi"></label>
<label class="grid gap-1"><span class="nd-aux">{{ l.pick("LAN Port", "LAN 端口") }}</span><input class="nd-field nd-mono" inputmode="numeric" autocomplete="off" placeholder="80" data-bind="_pl"></label>
<div class="flex items-center gap-3"><button type="button" role="switch" class="nd-switch t-switch" aria-labelledby="fw-pe-l" aria-checked="{{ on }}"{% if on %} data-selected="true"{% endif %} data-attr:aria-checked="$_pe ? 'true' : 'false'" data-attr:data-selected="$_pe" data-on:click="$_pe = !$_pe"><span class="nd-switch__track"><svg class="nd-switch__check" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.2 5 8.6 9.5 3.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="nd-switch__thumb"></span></span></button><span class="nd-body" id="fw-pe-l">{{ l.pick("Enabled", "已启用") }}</span></div>
</div>
{% if let Some(n) = lan %}<span class="nd-aux">{{ l.pick("LAN: ", "局域网：") }}<span class="nd-mono" data-data>{{ n }}</span></span>{% endif %}
<div><button type="button" class="nd-btn nd-btn--primary" data-on:click="@post('/router/firewall/pf/ask', {filterSignals: {include: /^_p/, exclude: /(?!)/}})">{{ l.pick("Save Rule", "保存规则") }}</button></div>
{% endif %}</div>{% endif %}</div>
