{% extends "base.html" %}
{% block head %}<link rel="stylesheet" href="{{ crate::assets::url("pages.css") }}">{% endblock %}
{% block main %}
<div data-signals="{exp: false, _cld: '', _cla: '', _cln: ''}">
<div class="mb-4 mt-2 flex items-center gap-2"><h1 class="nd-title flex-1">{{ shell.title() }}</h1><button type="button" class="nd-btn nd-btn--ghost nd-btn--icon" aria-label="{{ shell.t("Refresh", "刷新") }}" data-on:click="@post('/clients/refresh')">{{ crate::shell::icon("ArrowClockwise", false, 20, "")|safe }}</button></div>
<div class="pg-col">
{{ self.leaf("cl-status")|safe }}
<section><h2 class="nd-group-title">{{ shell.t("Connected devices", "已连接设备") }}</h2>
{{ self.leaf("cl-list")|safe }}
<div class="cl-op">{{ alias_op|safe }}</div>
</section>
</div>
</div>
{% endblock %}
