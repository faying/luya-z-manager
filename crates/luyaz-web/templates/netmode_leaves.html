<div id="nm-now" class="grid gap-2">{{ v.status()|safe }}{% if let Some(t) = v.txn %}<p class="t-note px-1" role="status">{{ t }}</p>{% endif %}{% if let Some(w) = v.why %}<p class="t-note t-note--warn px-1" role="alert">{{ w }}</p>{% endif %}</div>
<!--leaf-->
<div id="nm-cur" hidden data-signals="{_nmnow: '{{ v.cur }}', _dis: {{ v.dis }}}"></div>
