<div id="ap-form" class="nd-group grid gap-3 p-4 mt-2" role="group" aria-labelledby="ap-form-t" data-signals="{{ sigs }}">
<h3 id="ap-form-t" class="nd-body"><strong>{% if edit.is_some() %}{{ l.pick("Edit APN Profile", "编辑 APN 配置") }}{% else %}{{ l.pick("Add APN Profile", "添加 APN 配置") }}{% endif %}</strong></h3>
<label class="grid gap-1"><span class="nd-aux">{{ l.pick("Profile Name *", "配置名称 *") }}</span><input class="nd-field" autocomplete="off" placeholder="{{ l.pick("My APN", "我的 APN") }}" data-bind="_fname"></label>
<label class="grid gap-1"><span class="nd-aux">{{ l.pick("APN *", "APN *") }}</span><input class="nd-field nd-mono" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="internet" data-bind="_fapn"></label>
<label class="grid gap-1"><span class="nd-aux">{{ l.pick("Username", "用户名") }}</span><input class="nd-field" autocomplete="off" autocapitalize="off" placeholder="{{ l.pick("(optional)", "(可选)") }}" data-bind="_fuser"></label>
<label class="grid gap-1"><span class="nd-aux">{{ l.pick("Password", "密码") }}</span><input class="nd-field" type="password" autocomplete="new-password" placeholder="{% if self.has_pw() %}{{ l.pick("Set · leave empty to keep it", "已设置 · 留空不改") }}{% else %}{{ l.pick("(optional)", "(可选)") }}{% endif %}" data-bind="_fpw"></label>
<label class="grid gap-1"><span class="nd-aux">{{ l.pick("PDP Type", "PDP 类型") }}</span><select class="nd-field" data-bind="_fpdp"><option value="1">IPv4</option><option value="2">IPv6</option><option value="3">IPv4v6</option></select></label>
<label class="grid gap-1"><span class="nd-aux">{{ l.pick("Authentication", "认证方式") }}</span><select class="nd-field" data-bind="_fauth"><option value="0">none</option><option value="1">PAP</option><option value="2">CHAP</option></select></label>
{% if let Some(p) = edit %}{% if !p.enabled %}<label class="flex items-center gap-2"><input type="checkbox" data-bind="_fact"><span class="nd-body">{{ l.pick("Switch to this profile after saving", "保存后改用这条配置") }}</span></label>{% endif %}{% endif %}
<div class="flex flex-wrap gap-2"><button type="button" class="nd-btn nd-btn--primary" data-attr:disabled="$_dis || !$_fname.trim() || !$_fapn.trim()" data-on:click="@post('{{ crate::apn::PATH }}/save/ask', {filterSignals: {include: /^_f/, exclude: /(?!)/}})">{% if edit.is_some() %}{{ l.pick("Save Changes", "保存修改") }}{% else %}{{ l.pick("Save profile", "保存配置") }}{% endif %}</button><button type="button" class="nd-btn nd-btn--secondary" data-on:click="@post('{{ crate::apn::PATH }}/form/close')">{{ l.pick("Cancel", "取消") }}</button></div>
</div>
