<span id="st-remote" class="t-remote"{% if !remote.remote() %} hidden{% endif %} title="{{ remote.why(l) }}"><span class="sm:hidden">{{ remote.short(l) }}</span><span class="hidden sm:inline">{{ remote.long(l) }}</span><span class="sr-only"> — {{ remote.why(l) }}</span></span>
{% for i in icons %}<!--leaf-->
{% if i.known %}<a id="{{ i.id }}" class="{{ i.class() }}" href="{{ i.href }}" title="{{ i.label }}" aria-label="{{ i.label }}">{{ i.svg()|safe }}{% if i.badge > 0 %}<span class="t-st__badge" aria-hidden="true">{{ i.badge_text() }}</span>{% endif %}</a>{% else %}<span id="{{ i.id }}" hidden></span>{% endif %}
{% endfor %}
