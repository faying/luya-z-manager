<div id="adb-status"><section class="nd-status nd-status--{{ v.tone }}{% if v.stale %} nd-stale{% endif %}">
<div class="nd-status__main">
<div class="nd-status__state" role="status"><span class="nd-mark nd-mark--{{ v.tone }}"><span class="nd-mark__sym" aria-hidden="true">{{ v.symbol() }}</span><span>{{ v.state }}</span></span></div>
{% if let Some(r) = v.reason %}<div class="nd-status__reason"><span>{{ r }}</span></div>{% endif %}
</div>
{% if v.retry %}<div class="nd-status__actions"><button type="button" class="nd-btn nd-btn--secondary nd-btn--sm" data-on:click="@post('/tools/enable-adb/refresh')">{{ v.l.pick("Retry", "重试") }}</button></div>{% endif %}
</section></div>
<!--leaf-->
<div id="adb-btn" class="grid gap-2"><div><button type="button" class="nd-btn {% if v.on %}nd-btn--secondary{% else %}nd-btn--primary{% endif %}"{% if v.fixed %} disabled data-disabled="true" aria-describedby="adb-why"{% endif %} data-on:click="@post('/tools/enable-adb/ask')">{{ crate::shell::icon("TerminalWindow", false, 20, "")|safe }}{% if v.on %}{{ v.l.pick("Re-enable ADB", "重新启用 ADB") }}{% else %}{{ v.l.pick("Enable ADB Debug USB Mode", "启用 ADB 调试 USB 模式") }}{% endif %}</button></div>
{% if v.fixed %}<p id="adb-why" class="nd-aux">{{ v.l.pick("This firmware can't turn on ADB mode", "这版固件不能开 ADB 模式") }}</p>{% endif %}</div>
