<div id="dns-status"><section class="nd-status nd-status--{{ v.tone }}{% if v.tone == "stale" %} nd-stale{% endif %}">
<div class="nd-status__main">
<div class="nd-status__state" role="status"><span class="nd-mark nd-mark--{{ v.tone }}"><span class="nd-mark__sym" aria-hidden="true">{{ v.symbol() }}</span><span>{{ v.state }}</span></span></div>
{% if let Some(r) = v.reason %}<div class="nd-status__reason"><span class="nd-mono"{% if v.tone == "bad" %} role="alert"{% endif %} data-data>{{ r }}</span></div>{% endif %}
{% if let Some(m) = v.meta %}<div class="nd-status__meta"><span class="nd-fresh">{{ m }}</span></div>{% endif %}
</div>
{% if v.retry %}<div class="nd-status__actions"><button type="button" class="nd-btn nd-btn--secondary nd-btn--sm" data-on:click="@post('/router/dns/refresh')">{{ v.l.pick("Retry", "重试") }}</button></div>{% endif %}
</section></div>
<!--leaf-->
<span id="dns-op-now" class="nd-aux"{% if v.operator.is_none() %} hidden{% endif %}>{% if let Some(o) = v.operator %}{{ v.l.pick("Now:", "当前：") }} <span class="nd-mono" data-data>{{ o }}</span>{% endif %}</span>
