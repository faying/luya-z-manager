[package]
name = "luyaz-web"
version = "1.15.1"
edition = "2024"
rust-version = "1.99"
description = "U60 Pro (MU5250) admin web: server-rendered pages (askama) pushed with Datastar. One upstream /v2/events connection to u60d, fanned out to the open tabs (u60-web.md E1, E2). `luyaz-web mock` replays a recorded /v2/events stream for local tests."
license = "MIT"

[dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "signal", "macros", "sync", "io-util"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "form", "multipart", "tokio"] }
askama = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json"] }
flate2 = "1"
luyaz-api = { path = "../luyaz-api" }
sha2 = "0.10"
# chill_proxy.rs: WebSocket pass-through (already in the tree through axum)
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
# main.rs accept_loop: calls the Router directly (already in the tree through axum)
tower-service = "0.3"
