[package]
name = "luyaz-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "U60 Pro (MU5250) API pieces shared by luyaz-core's v2 API and luyaz-web: the alert files, the admin password login, the device clock's offset."
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
luyaz-alerts = { path = "../luyaz-alerts" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
