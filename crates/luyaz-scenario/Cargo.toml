[package]
name = "luyaz-scenario"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
description = "U60 Pro (MU5250) scenario engine runtime (scan, switch, apply and roll back, restores, boot safety, heartbeat, the web routes), run by the core. The decisions are u60-policy's `scenario::step`; everything device-side goes through the host's `Io`."
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[features]
# testing::Fake, a fake device for u60d's tests
testing = []

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
luyaz-api = { path = "../luyaz-api" }
luyaz-policy = { path = "../luyaz-policy", features = ["serde"] }
luyaz-wifi = { path = "../luyaz-wifi" }
