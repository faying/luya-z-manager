[package]
name = "luyaz-alerts"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "U60 Pro (MU5250) alert files under /data/alerts (queue, SMS log, cursors, flags; the format alert-lib.sh writes), shared by u60d and luyaz-sentinel. Split out of u60-api (u60-sentinel.md D9) so the sentinel does not carry the login code."
license = "MIT"
publish = false

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
